services:
  postgres_db:
    image: postgres:18.6
    
    restart: unless-stopped
    
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    
    volumes:
      - pgdata:/var/lib/postgresql #host:container , pgdata is on docker vm machine 
    
    ports:
      - "5432:5432" #host:container
      # this is only for the laptop to reach pgadmin or database tools, and alembic to work

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  api_app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"

    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
    depends_on:
      postgres_db:
        condition: service_healthy





volumes:
  pgdata: