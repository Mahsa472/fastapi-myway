{% extends "base.html" %}

{% block title %}Log in · {% endblock %}

{% block content %}
<div class="auth">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to write and manage your stories.</p>

        {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}

        <form method="post" action="/login" class="form">
            <input type="hidden" name="next" value="{{ next }}">
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" required value="{{ email or '' }}" autocomplete="email" autofocus>
            </label>
            <label class="field">
                <span>Password</span>
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <p class="auth-switch">New here? <a href="/register">Create an account</a></p>
    </div>
</div>
{% endblock %}
